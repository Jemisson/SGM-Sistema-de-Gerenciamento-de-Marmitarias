components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - admin
          - manager
          - cashier
        active:
          type: boolean
    error_response:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    message_response:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
    audit_log:
      type: object
      properties:
        id:
          type: integer
        user:
          "$ref": "#/components/schemas/user"
        action:
          type: string
        auditable_type:
          type: string
          nullable: true
        auditable_id:
          type: integer
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
        occurred_at:
          type: string
          format: date-time
    cash_movement:
      type: object
      properties:
        id:
          type: integer
        user:
          "$ref": "#/components/schemas/user"
        movement_type:
          type: string
          enum:
          - opening
          - sale
          - income
          - expense
          - adjustment
          - closing
        amount:
          type: string
        description:
          type: string
          nullable: true
        source_type:
          type: string
          nullable: true
        source_id:
          type: integer
          nullable: true
        occurred_at:
          type: string
          format: date-time
    cash_session:
      type: object
      properties:
        id:
          type: integer
        opened_by:
          "$ref": "#/components/schemas/user"
        closed_by:
          "$ref": "#/components/schemas/user"
          nullable: true
        opening_amount:
          type: string
        closing_amount:
          type: string
          nullable: true
        expected_amount:
          type: string
          nullable: true
        difference_amount:
          type: string
          nullable: true
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - opened
          - closed
        notes:
          type: string
          nullable: true
        cash_movements:
          type: array
          items:
            "$ref": "#/components/schemas/cash_movement"
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    cash_session_open_payload:
      type: object
      properties:
        cash_session:
          type: object
          properties:
            opening_amount:
              type: string
              example: '100.00'
            opened_at:
              type: string
              format: date-time
            notes:
              type: string
              example: Inicio do turno
          required:
          - opening_amount
      required:
      - cash_session
    cash_session_close_payload:
      type: object
      properties:
        cash_session:
          type: object
          properties:
            closing_amount:
              type: string
              example: '125.00'
            closed_at:
              type: string
              format: date-time
            notes:
              type: string
              example: Fechamento sem divergencias
          required:
          - closing_amount
      required:
      - cash_session
    category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    category_payload:
      type: object
      properties:
        category:
          type: object
          properties:
            name:
              type: string
              example: Marmitas
            description:
              type: string
              example: Categorias de marmitas prontas
            active:
              type: boolean
              example: true
          required:
          - name
      required:
      - category
    supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cnpj:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    supplier_payload:
      type: object
      properties:
        supplier:
          type: object
          properties:
            name:
              type: string
              example: Fornecedor Central
            cnpj:
              type: string
              example: '12345678000199'
            phone:
              type: string
              example: '44999999999'
            email:
              type: string
              example: central@sgm.test
            street:
              type: string
              example: Avenida Colombo
            number:
              type: string
              example: '5790'
            neighborhood:
              type: string
              example: Zona 7
            city:
              type: string
              example: Maringa
            state:
              type: string
              example: PR
            zip_code:
              type: string
              example: '87020900'
            active:
              type: boolean
              example: true
          required:
          - name
          - cnpj
      required:
      - supplier
    ingredient:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
        supplier:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
        unit:
          type: string
        current_stock:
          type: string
        minimum_stock:
          type: string
        purchase_price:
          type: string
          nullable: true
        manufacturing_date:
          type: string
          format: date
          nullable: true
        expiration_date:
          type: string
          format: date
          nullable: true
        received_at:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    ingredient_payload:
      type: object
      properties:
        ingredient:
          type: object
          properties:
            code:
              type: string
              example: INS001
            name:
              type: string
              example: Arroz
            category_id:
              type: integer
            supplier_id:
              type: integer
            unit:
              type: string
              example: kg
            current_stock:
              type: string
              example: '10.500'
            minimum_stock:
              type: string
              example: '2.000'
            purchase_price:
              type: string
              example: '15.90'
            manufacturing_date:
              type: string
              format: date
            expiration_date:
              type: string
              format: date
            received_at:
              type: string
              format: date
            notes:
              type: string
              example: Insumo usado na produção
            active:
              type: boolean
              example: true
          required:
          - code
          - name
          - category_id
          - supplier_id
          - unit
      required:
      - ingredient
    product:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
