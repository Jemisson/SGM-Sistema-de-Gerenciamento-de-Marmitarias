        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    post:
      summary: Creates a category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/category"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/category_payload"
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Shows a category
      tags:
      - Categories
      security:
      - bearerAuth: []
      responses:
        '200':
          description: category found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/category"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Updates a category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/category"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/category_payload"
    delete:
      summary: Soft deletes a category
      tags:
      - Categories
      security:
      - bearerAuth: []
      responses:
        '200':
          description: category disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/category"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
